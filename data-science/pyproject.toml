[project]
name = "mixmind-data-science"
version = "0.1.0"
description = "Pedagogical data science and experimentation layer for MixMind"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
